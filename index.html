<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BMW Glass Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #17253d 0%, #070b14 68%);
      color: #f8fafc;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .calculator {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 380px;
      background: rgba(12, 18, 30, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top-color: rgba(255, 255, 255, 0.28);
      border-radius: 28px;
      padding: 22px;
      box-shadow:
        0 28px 60px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.22);
    }

    /* Centered BMW Logo behind the glass keys */
    .bmw-bg {
      position: absolute;
      width: 78%;
      max-width: 295px;
      height: auto;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      opacity: 0.88;
      filter: drop-shadow(0 0 28px rgba(0, 122, 217, 0.35));
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    .screen,
    .keys {
      position: relative;
      z-index: 1;
    }

    /* Frosted Glass Display */
    .screen {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.38));
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-top-color: rgba(255, 255, 255, 0.34);
      border-radius: 20px;
      padding: 18px 16px;
      margin-bottom: 18px;
      text-align: right;
      min-height: 112px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.28),
        0 10px 24px rgba(0, 0, 0, 0.28);
    }
    .expression {
      min-height: 22px;
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 6px;
      overflow-x: auto;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }
    .display {
      font-size: clamp(2.1rem, 9vw, 2.9rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      overflow-x: auto;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* Glass Keys */
    button {
      position: relative;
      border-radius: 18px;
      height: 64px;
      font-size: 1.38rem;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.06) 100%
      );
      backdrop-filter: blur(7px) saturate(145%);
      -webkit-backdrop-filter: blur(7px) saturate(145%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-top-color: rgba(255, 255, 255, 0.48);
      border-left-color: rgba(255, 255, 255, 0.36);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.45),
        inset 0 -2px 4px rgba(0, 0, 0, 0.18),
        0 8px 18px rgba(0, 0, 0, 0.28);
      transition: transform 0.08s ease, background 0.15s ease, box-shadow 0.15s ease;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active {
      transform: scale(0.95);
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.34) 0%,
        rgba(255, 255, 255, 0.14) 100%
      );
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.25),
        0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .utility {
      background: linear-gradient(
        145deg,
        rgba(226, 232, 240, 0.28) 0%,
        rgba(148, 163, 184, 0.10) 100%
      );
    }

    /* BMW Blue Tinted Glass Operators */
    .operator {
      background: linear-gradient(
        145deg,
        rgba(41, 151, 255, 0.42) 0%,
        rgba(0, 85, 150, 0.22) 100%
      );
      border-color: rgba(125, 211, 252, 0.38);
      border-top-color: rgba(186, 230, 253, 0.62);
    }
    .operator.active {
      background: linear-gradient(
        145deg,
        rgba(125, 211, 252, 0.68) 0%,
        rgba(56, 189, 248, 0.42) 100%
      );
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.65),
        0 0 16px rgba(56, 189, 248, 0.45);
    }

    /* M-Red Tinted Glass Equals */
    .equals {
      background: linear-gradient(
        145deg,
        rgba(239, 68, 68, 0.56) 0%,
        rgba(185, 28, 28, 0.30) 100%
      );
      border-color: rgba(252, 165, 165, 0.42);
      border-top-color: rgba(254, 202, 202, 0.68);
    }

    .zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator">
    <!-- Centered Inline SVG BMW Roundel -->
    <svg class="bmw-bg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="bmwChrome" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="50%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>
        <radialGradient id="bmwBlue" cx="35%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#38a6ff" />
          <stop offset="100%" stop-color="#005596" />
        </radialGradient>
      </defs>

      <!-- Outer Chrome Rim & Black Ring -->
      <circle cx="200" cy="200" r="196" fill="url(#bmwChrome)" />
      <circle cx="200" cy="200" r="186" fill="#09090b" />

      <!-- Inner Chrome Ring & Quarters -->
      <circle cx="200" cy="200" r="128" fill="url(#bmwChrome)" />
      <circle cx="200" cy="200" r="122" fill="#f8fafc" />
      <path d="M 200 200 L 78 200 A 122 122 0 0 1 200 78 Z" fill="url(#bmwBlue)" />
      <path d="M 200 200 L 322 200 A 122 122 0 0 1 200 322 Z" fill="url(#bmwBlue)" />

      <!-- Silver Cross Dividers -->
      <line x1="200" y1="78" x2="200" y2="322" stroke="#cbd5e1" stroke-width="3.5" />
      <line x1="78" y1="200" x2="322" y2="200" stroke="#cbd5e1" stroke-width="3.5" />

      <!-- Radial BMW Lettering -->
      <g fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="middle">
        <text x="200" y="43" dy="0.35em" transform="rotate(-48 200 200)">B</text>
        <text x="200" y="43" dy="0.35em">M</text>
        <text x="200" y="43" dy="0.35em" transform="rotate(48 200 200)">W</text>
      </g>
    </svg>

    <div class="screen">
      <div class="expression" id="expression"></div>
      <div class="display" id="display">0</div>
    </div>

    <div class="keys">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="backspace">⌫</button>
      <button class="utility" data-action="percent">%</button>
      <button class="operator" data-operator="/">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="*">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="-">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operator="+">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </main>

  <script>
    const displayEl = document.getElementById("display");
    const expressionEl = document.getElementById("expression");
    const operatorButtons = document.querySelectorAll("[data-operator]");

    const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };

    let current = "0";
    let previous = null;
    let operator = null;
    let waitingForSecond = false;
    let justEvaluated = false;

    function formatResult(num) {
      if (!Number.isFinite(num)) return "Error";
      return String(parseFloat(num.toPrecision(12)));
    }

    function updateUI() {
      displayEl.textContent = current;
      operatorButtons.forEach((btn) => {
        btn.classList.toggle("active", waitingForSecond && btn.dataset.operator === operator);
      });
    }

    function calculate(a, b, op) {
      if (op === "+") return formatResult(a + b);
      if (op === "-") return formatResult(a - b);
      if (op === "*") return formatResult(a * b);
      if (op === "/") return b === 0 ? "Error" : formatResult(a / b);
      return String(b);
    }

    function clearAll() {
      current = "0";
      previous = null;
      operator = null;
      waitingForSecond = false;
      justEvaluated = false;
      expressionEl.textContent = "";
      updateUI();
    }

    function inputDigit(digit) {
      if (current === "Error" || justEvaluated) {
        current = digit;
        expressionEl.textContent = "";
        justEvaluated = false;
        waitingForSecond = false;
      } else if (waitingForSecond) {
        current = digit;
        waitingForSecond = false;
      } else {
        current = current === "0" ? digit : current + digit;
      }
      updateUI();
    }

    function inputDecimal() {
      if (current === "Error" || justEvaluated) {
        current = "0.";
        expressionEl.textContent = "";
        justEvaluated = false;
        waitingForSecond = false;
      } else if (waitingForSecond) {
        current = "0.";
        waitingForSecond = false;
      } else if (!current.includes(".")) {
        current += ".";
      }
      updateUI();
    }

    function chooseOperator(nextOp) {
      if (current === "Error") return;

      if (operator && !waitingForSecond && previous !== null) {
        const result = calculate(parseFloat(previous), parseFloat(current), operator);
        current = result;
        if (result === "Error") {
          previous = null;
          operator = null;
          waitingForSecond = false;
          expressionEl.textContent = "";
          updateUI();
          return;
        }
      }

      previous = current;
      operator = nextOp;
      waitingForSecond = true;
      justEvaluated = false;
      expressionEl.textContent = `${previous} ${symbols[operator]}`;
      updateUI();
    }

    function evaluate() {
      if (!operator || previous === null || current === "Error") return;
      const a = parseFloat(previous);
      const b = parseFloat(current);
      expressionEl.textContent = `${previous} ${symbols[operator]} ${current} =`;
      current = calculate(a, b, operator);
      previous = null;
      operator = null;
      waitingForSecond = false;
      justEvaluated = true;
      updateUI();
    }

    function applyPercent() {
      if (current === "Error") return;
      current = formatResult(parseFloat(current) / 100);
      updateUI();
    }

    function backspace() {
      if (current === "Error" || justEvaluated) {
        clearAll();
        return;
      }
      if (waitingForSecond) return;
      current = current.length > 1 ? current.slice(0, -1) : "0";
      if (current === "-") current = "0";
      updateUI();
    }

    document.querySelector(".keys").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      if (btn.dataset.digit) inputDigit(btn.dataset.digit);
      else if (btn.dataset.operator) chooseOperator(btn.dataset.operator);
      else if (btn.dataset.action === "decimal") inputDecimal();
      else if (btn.dataset.action === "equals") evaluate();
      else if (btn.dataset.action === "clear") clearAll();
      else if (btn.dataset.action === "percent") applyPercent();
      else if (btn.dataset.action === "backspace") backspace();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") inputDigit(e.key);
      else if (["+", "-", "*", "/"].includes(e.key)) chooseOperator(e.key);
      else if (e.key === ".") inputDecimal();
      else if (e.key === "Enter" || e.key === "=") evaluate();
      else if (e.key === "Backspace") backspace();
      else if (e.key === "Escape") clearAll();
      else if (e.key === "%") applyPercent();
    });
  </script>
</body>
</html>
