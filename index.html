<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BMW Glass Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #17253d 0%, #070b14 68%);
      color: #f8fafc;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .calculator {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 380px;
      background: rgba(12, 18, 30, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top-color: rgba(255, 255, 255, 0.28);
      border-radius: 28px;
      padding: 22px;
      box-shadow:
        0 28px 60px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.22);
    }
    .bmw-bg {
      position: absolute;
      width: 78%;
      max-width: 295px;
      height: auto;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      opacity: 0.88;
      filter: drop-shadow(0 0 28px rgba(0, 122, 217, 0.35));
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }
    .screen,
    .keys {
      position: relative;
      z-index: 1;
    }
    .screen {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.68), rgba(15, 23, 42, 0.42));
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-top-color: rgba(255, 255, 255, 0.34);
      border-radius: 20px;
      padding: 14px 16px;
      margin-bottom: 18px;
      min-height: 100px;
      display: flex;
      align-items: center;
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.28),
        0 10px 24px rgba(0, 0, 0, 0.28);
    }
    #typingBox {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      text-align: right;
      font-family: inherit;
      font-size: clamp(2rem, 8.5vw, 2.7rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      caret-color: #38bdf8;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
      -webkit-appearance: none;
    }
    #typingBox::placeholder {
      color: rgba(203, 213, 225, 0.45);
    }
    #typingBox.answer-flash {
      animation: answerReveal 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes answerReveal {
      0% { transform: translateY(4px) scale(0.97); opacity: 0.7; }
      60% { transform: translateY(-1px) scale(1.02); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    button {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      height: 64px;
      font-size: 1.38rem;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.06) 100%
      );
      backdrop-filter: blur(7px) saturate(145%);
      -webkit-backdrop-filter: blur(7px) saturate(145%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-top-color: rgba(255, 255, 255, 0.48);
      border-left-color: rgba(255, 255, 255, 0.36);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.45),
        inset 0 -2px 4px rgba(0, 0, 0, 0.18),
        0 8px 18px rgba(0, 0, 0, 0.28);
      transform: translateY(0) scale(1);
      transition:
        transform 0.26s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.22s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 70%);
      opacity: 0;
      transform: scale(0.4);
      pointer-events: none;
    }
    button.glow::after {
      animation: glassPulse 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes glassPulse {
      0% { opacity: 0.9; transform: scale(0.45); }
      100% { opacity: 0; transform: scale(1.8); }
    }
    button.pressed {
      transform: translateY(2px) scale(0.94);
      transition-duration: 0.08s;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.34) 0%,
        rgba(255, 255, 255, 0.14) 100%
      );
      border-color: rgba(255, 255, 255, 0.52);
      box-shadow:
        inset 0 2px 7px rgba(0, 0, 0, 0.28),
        0 2px 8px rgba(0, 0, 0, 0.22);
    }
    .utility {
      background: linear-gradient(
        145deg,
        rgba(226, 232, 240, 0.28) 0%,
        rgba(148, 163, 184, 0.10) 100%
      );
    }
    .operator {
      background: linear-gradient(
        145deg,
        rgba(41, 151, 255, 0.42) 0%,
        rgba(0, 85, 150, 0.22) 100%
      );
      border-color: rgba(125, 211, 252, 0.38);
      border-top-color: rgba(186, 230, 253, 0.62);
    }
    .equals {
      background: linear-gradient(
        145deg,
        rgba(239, 68, 68, 0.56) 0%,
        rgba(185, 28, 28, 0.30) 100%
      );
      border-color: rgba(252, 165, 165, 0.42);
      border-top-color: rgba(254, 202, 202, 0.68);
    }
    .zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator">
    <svg class="bmw-bg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="bmwChrome" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="50%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>
        <radialGradient id="bmwBlue" cx="35%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#38a6ff" />
          <stop offset="100%" stop-color="#005596" />
        </radialGradient>
      </defs>
      <circle cx="200" cy="200" r="196" fill="url(#bmwChrome)" />
      <circle cx="200" cy="200" r="186" fill="#09090b" />
      <circle cx="200" cy="200" r="128" fill="url(#bmwChrome)" />
      <circle cx="200" cy="200" r="122" fill="#f8fafc" />
      <path d="M 200 200 L 78 200 A 122 122 0 0 1 200 78 Z" fill="url(#bmwBlue)" />
      <path d="M 200 200 L 322 200 A 122 122 0 0 1 200 322 Z" fill="url(#bmwBlue)" />
      <line x1="200" y1="78" x2="200" y2="322" stroke="#cbd5e1" stroke-width="3.5" />
      <line x1="78" y1="200" x2="322" y2="200" stroke="#cbd5e1" stroke-width="3.5" />
      <g fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="middle">
        <text x="200" y="43" dy="0.35em" transform="rotate(-48 200 200)">B</text>
        <text x="200" y="43" dy="0.35em">M</text>
        <text x="200" y="43" dy="0.35em" transform="rotate(48 200 200)">W</text>
      </g>
    </svg>

    <div class="screen">
      <input
        id="typingBox"
        type="text"
        value=""
        placeholder="0"
        autocomplete="off"
        spellcheck="false"
        aria-label="Calculator typing box"
      />
    </div>

    <div class="keys">
      <button type="button" class="utility" data-action="clear">AC</button>
      <button type="button" class="utility" data-action="backspace">⌫</button>
      <button type="button" class="utility" data-action="percent">%</button>
      <button type="button" class="operator" data-operator="÷">÷</button>

      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button type="button" class="operator" data-operator="×">×</button>

      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button type="button" class="operator" data-operator="−">−</button>

      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button type="button" class="operator" data-operator="+">+</button>

      <button type="button" class="zero" data-digit="0">0</button>
      <button type="button" data-action="decimal">.</button>
      <button type="button" class="equals" data-action="equals">=</button>
    </div>
  </main>

  <script>
    (() => {
      const typingBox = document.getElementById("typingBox");
      const keysContainer = document.querySelector(".keys");
      const operators = ["+", "−", "×", "÷", "-", "*", "/"];
      let justEvaluated = false;

      function scrollBox() {
        typingBox.scrollLeft = typingBox.scrollWidth;
      }

      function flashAnswer() {
        typingBox.classList.remove("answer-flash");
        void typingBox.offsetWidth;
        typingBox.classList.add("answer-flash");
      }

      function pulseKey(btn) {
        btn.classList.remove("glow");
        void btn.offsetWidth;
        btn.classList.add("glow");
      }

      function evaluateExpression(raw) {
        const normalized = raw
          .replace(/×/g, "*")
          .replace(/[xX]/g, "*")
          .replace(/÷/g, "/")
          .replace(/−/g, "-")
          .replace(/=+$/g, "")
          .replace(/\s+/g, "");

        if (!normalized || !/^[0-9+\-*/.%()]+$/.test(normalized)) {
          return null;
        }

        let pos = 0;
        const peek = () => normalized[pos];

        function parseExpr() {
          let val = parseTerm();
          while (peek() === "+" || peek() === "-") {
            const op = normalized[pos++];
            const right = parseTerm();
            val = op === "+" ? val + right : val - right;
          }
          return val;
        }

        function parseTerm() {
          let val = parseUnary();
          while (peek() === "*" || peek() === "/") {
            const op = normalized[pos++];
            const right = parseUnary();
            val = op === "*" ? val * right : val / right;
          }
          return val;
        }

        function parseUnary() {
          if (peek() === "+") { pos++; return parseUnary(); }
          if (peek() === "-") { pos++; return -parseUnary(); }
          return parsePostfix();
        }

        function parsePostfix() {
          let val = parsePrimary();
          while (peek() === "%") {
            pos++;
            val = val / 100;
          }
          return val;
        }

        function parsePrimary() {
          if (peek() === "(") {
            pos++;
            const val = parseExpr();
            if (peek() !== ")") throw new Error("Unmatched");
            pos++;
            return val;
          }
          const start = pos;
          let seenDot = false;
          while (pos < normalized.length) {
            const ch = normalized[pos];
            if (ch >= "0" && ch <= "9") pos++;
            else if (ch === "." && !seenDot) { seenDot = true; pos++; }
            else break;
          }
          if (start === pos || normalized.slice(start, pos) === ".") {
            throw new Error("Invalid");
          }
          return parseFloat(normalized.slice(start, pos));
        }

        try {
          const result = parseExpr();
          if (pos !== normalized.length || !Number.isFinite(result)) return "Error";
          return String(parseFloat(result.toPrecision(12)));
        } catch {
          return "Error";
        }
      }

      function appendDigit(digit) {
        if (typingBox.value === "Error" || justEvaluated) {
          typingBox.value = digit;
          justEvaluated = false;
        } else {
          typingBox.value += digit;
        }
        scrollBox();
      }

      function appendDecimal() {
        if (typingBox.value === "Error" || justEvaluated) {
          typingBox.value = "0.";
          justEvaluated = false;
          scrollBox();
          return;
        }
        const lastPart = typingBox.value.split(/[+−×÷\-*/()]/).pop();
        if (!lastPart.includes(".")) {
          typingBox.value += lastPart === "" ? "0." : ".";
        }
        scrollBox();
      }

      function appendOperator(op) {
        if (typingBox.value === "Error") typingBox.value = "";
        justEvaluated = false;
        const val = typingBox.value;
        if (val === "") {
          if (op === "−") typingBox.value = "−";
          return;
        }
        const last = val.slice(-1);
        typingBox.value = operators.includes(last) ? val.slice(0, -1) + op : val + op;
        scrollBox();
      }

      function appendPercent() {
        const val = typingBox.value;
        if (!val || val === "Error") return;
        if (!operators.includes(val.slice(-1))) {
          typingBox.value += "%";
          justEvaluated = false;
          scrollBox();
        }
      }

      function backspace() {
        typingBox.value = typingBox.value === "Error" ? "" : typingBox.value.slice(0, -1);
        justEvaluated = false;
        scrollBox();
      }

      function clearAll() {
        typingBox.value = "";
        justEvaluated = false;
      }

      function solve() {
        const val = typingBox.value.trim();
        if (!val || val === "Error" || operators.includes(val.slice(-1))) return;
        const result = evaluateExpression(val);
        if (result !== null) {
          typingBox.value = result;
          justEvaluated = result !== "Error";
          flashAnswer();
          scrollBox();
        }
      }

      keysContainer.addEventListener("pointerdown", (e) => {
        const btn = e.target.closest("button");
        if (btn) btn.classList.add("pressed");
      });

      const releaseAll = () => {
        document.querySelectorAll("button.pressed").forEach((b) => b.classList.remove("pressed"));
      };
      window.addEventListener("pointerup", releaseAll);
      window.addEventListener("pointercancel", releaseAll);

      keysContainer.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        pulseKey(btn);

        if (btn.dataset.digit) appendDigit(btn.dataset.digit);
        else if (btn.dataset.operator) appendOperator(btn.dataset.operator);
        else if (btn.dataset.action === "decimal") appendDecimal();
        else if (btn.dataset.action === "percent") appendPercent();
        else if (btn.dataset.action === "backspace") backspace();
        else if (btn.dataset.action === "clear") clearAll();
        else if (btn.dataset.action === "equals") solve();
      });

      typingBox.addEventListener("input", () => {
        justEvaluated = false;
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === "=") {
          e.preventDefault();
          solve();
        } else if (e.key === "Escape") {
          e.preventDefault();
          clearAll();
        }
      });
    })();
  </script>
</body>
</html>
